<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Snake Game</title>
    <link rel="stylesheet" href="./src/styles.css">
</head>
<body class="bg-black overflow-hidden">
    <div class="min-h-screen flex flex-col items-center justify-center">
        <!-- Game Container -->
        <div class="relative w-full max-w-2xl aspect-square bg-black border-2 border-cyan-500 shadow-lg shadow-cyan-500/50 rounded-lg overflow-hidden">
            <canvas id="gameCanvas" class="w-full h-full block"></canvas>
            
            <!-- Game UI Overlay -->
            <div class="absolute top-4 left-4 text-cyan-400 font-mono text-sm">
                <div class="score-display">Score: <span id="score">0</span></div>
                <div class="high-score-display">High: <span id="highScore">0</span></div>
            </div>
            
            <!-- Game Over Screen -->
            <div id="gameOverScreen" class="hidden absolute inset-0 bg-black/80 flex flex-col items-center justify-center">
                <h1 class="text-4xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-purple-500 mb-4">GAME OVER</h1>
                <p class="text-cyan-400 text-xl mb-8">Final Score: <span id="finalScore">0</span></p>
                <button id="restartBtn" class="px-8 py-3 bg-gradient-to-r from-cyan-500 to-purple-500 text-white font-bold rounded-lg hover:shadow-lg hover:shadow-cyan-500/50 transition">RESTART</button>
            </div>
            
            <!-- Start Screen -->
            <div id="startScreen" class="absolute inset-0 bg-black/90 flex flex-col items-center justify-center">
                <h1 class="text-5xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-purple-500 to-pink-500 mb-4 animate-pulse">NEON SNAKE</h1>
                <p class="text-cyan-400 text-lg mb-8 text-center">Use Arrow Keys or Swipe to Move</p>
                <button id="startBtn" class="px-8 py-3 bg-gradient-to-r from-cyan-500 to-purple-500 text-white font-bold rounded-lg hover:shadow-lg hover:shadow-cyan-500/50 transition animate-bounce">START GAME</button>
            </div>
        </div>
        
        <!-- Controls Info -->
        <div class="mt-8 text-cyan-400 text-center font-mono text-sm">
            <p>🎮 Use Arrow Keys or WASD to move</p>
            <p>📱 Swipe on mobile devices</p>
            <p>⚡ Collect food to grow and earn points</p>
        </div>
    </div>

    <script type="module" src="./src/main.ts"></script>
</body>
</html>
